# GitHub Pages 自动部署：push 到 main 后构建静态站点并发布 out/ 目录。
# 仓库 Settings → Pages → Source 需选择 "GitHub Actions"。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # 可选：在仓库 Settings → Secrets and variables → Actions → Variables 中配置
          NEXT_PUBLIC_ADMIN_PASSWORD_HASH: ${{ vars.NEXT_PUBLIC_ADMIN_PASSWORD_HASH }}
          NEXT_PUBLIC_PARTNER_PASSWORD_HASH: ${{ vars.NEXT_PUBLIC_PARTNER_PASSWORD_HASH }}
          NEXT_PUBLIC_INVESTOR_PASSWORD_HASH: ${{ vars.NEXT_PUBLIC_INVESTOR_PASSWORD_HASH }}
          NEXT_PUBLIC_DEMO_MODE: ${{ vars.NEXT_PUBLIC_DEMO_MODE }}

      - name: Verify sql.js WebAssembly asset
        run: test -f out/sql-wasm.wasm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
